<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torture Methods</title>
    <link rel="stylesheet" href="frontpage.css">
</head>
<body style="background-color: rgb(79, 48, 48);">
    <h1>Welcome to the goriest website on the internet! >:D</h1>

    <h3 id="under-construction-headline">The wesite is under construction</h3>

    <div>
        <h4>Counter. People who have been killed by visiting this site</h4>
        <h3 id="counter"></h3>
    </div>

    <script>
        // Task make GET request to /api/counter, console.log the value
        // Task update the counter tag
        fetch('/api/counter')
        .then((response) => response.json())

        })
